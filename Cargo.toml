[workspace]
resolver = "3"
members = ["crates/*", "vendor/lightcraft/crates/*"]

# Lightcraft's, which its vendored crates inherit. OmaLux's own crates set
# theirs (GPL-3.0-or-later) in their own manifests.
[workspace.package]
version = "0.7.1"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Vendored from Lightcraft (vendor/lightcraft/UPSTREAM.md). JPEG XL and AVIF
# are left out of what OmaLux builds: it never reads or writes them. Their
# own tests still build them.
lightcraft-geom = { path = "vendor/lightcraft/crates/geom" }
lightcraft-color = { path = "vendor/lightcraft/crates/color" }
lightcraft-raster = { path = "vendor/lightcraft/crates/raster" }
lightcraft-tiff = { path = "vendor/lightcraft/crates/tiff" }
lightcraft-raw = { path = "vendor/lightcraft/crates/raw", default-features = false }
lightcraft-codecs = { path = "vendor/lightcraft/crates/codecs", default-features = false, features = ["parallel"] }
lightcraft-meta = { path = "vendor/lightcraft/crates/meta" }
lightcraft-develop = { path = "vendor/lightcraft/crates/develop" }
lightcraft-pipeline = { path = "vendor/lightcraft/crates/pipeline" }
lightcraft-gpu = { path = "vendor/lightcraft/crates/gpu" }
lightcraft-scenes = { path = "vendor/lightcraft/crates/scenes" }
lightcraft-inpaint = { path = "vendor/lightcraft/crates/inpaint" }
lightcraft-heif = { path = "vendor/lightcraft/crates/heif" }
lightcraft-denoise-core = { path = "vendor/lightcraft/crates/denoise-core" }
lightcraft-denoise = { path = "vendor/lightcraft/crates/denoise", default-features = false }
lightcraft-lensdb = { path = "vendor/lightcraft/crates/lensdb" }

# What the vendored crates use, as Lightcraft's workspace has it at the
# pinned commit.
thiserror = "2"
sha2 = "0.10"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
rayon = "1"
proptest = "1"
bytemuck = { version = "1", features = ["derive"] }
libc = "0.2"
quick-xml = "0.38"
miniz_oxide = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "webp"] }
zune-jpeg = { version = "0.5", default-features = false, features = ["std", "x86", "neon"] }
zune-core = { version = "0.5", default-features = false, features = ["std"] }
jpeg-decoder = { version = "0.3", default-features = false }
jpeg-encoder = { version = "0.7", default-features = false, features = ["std"] }
png = "0.18"
tiff = "0.11"
image-webp = "0.2"
moxcms = { version = "0.9", default-features = false, features = ["lut"] }
jxl-oxide = { version = "0.12", default-features = false }
jixel = "=0.3.4"
zune-jpegxl = { version = "0.5", default-features = false, features = ["std"] }
ravif = { version = "0.13", default-features = false, features = ["threading"] }
rav1e = { version = "0.8.1", default-features = false, features = ["threading"] }
avif-serialize = "0.8.6"
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "vulkan", "wgsl"] }
pollster = "1"
web-time = "1"

# Lightcraft's, for its crates; OmaLux's own crates don't opt in.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"
excessive_precision = "allow"

# Raw decoding and the CPU pipeline are too slow unoptimised to test with
# real frames, so optimise dependencies even in debug builds.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 4
